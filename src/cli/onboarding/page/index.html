<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Connect your wallet · Flexx</title>
    <link rel="stylesheet" href="/connect.css" />
    <script src="/connect.js" defer></script>
  </head>
  <body>
    <main>
      <div class="brand">FLEXX <span>WALLET CONNECTION</span></div>
      <h1>Connect your wallet.</h1>
      <p>Choose the MetaMask account you want to use in your terminal.</p>
      <p class="detail">Flexx saves your public address. Payments still need your approval in MetaMask.</p>
      <div id="selection" hidden>
        <label for="accounts">Choose an account</label>
        <select id="accounts"></select>
        <button id="use-account" type="button">Use this account</button>
      </div>
      <button id="connect" type="button">Connect MetaMask</button>
      <p id="status" role="status" aria-live="polite">Looking for MetaMask in this browser…</p>
      <button id="cancel" type="button" class="secondary">Cancel</button>
    </main>
  </body>
</html>
