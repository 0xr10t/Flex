# CRE project settings. The RPC URLs use secrets from a local .env file, which is never committed.
staging-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: ${CRE_SECRET_RPC_SEPOLIA}
    - chain-name: ethereum-testnet-sepolia-base-1
      url: ${CRE_SECRET_RPC_BASE_SEPOLIA}
    - chain-name: ethereum-testnet-sepolia-arbitrum-1
      url: ${CRE_SECRET_RPC_ARBITRUM_SEPOLIA}
